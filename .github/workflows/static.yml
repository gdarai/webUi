name: Publish dist to gdarai.github.io

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      # Optional safety check: fail if dist is missing
      - name: Ensure dist exists
        run: test -f dist/index.html

      - name: Deploy dist to gdarai/gdarai.github.io
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.PAGES_REPO_TOKEN }}
          repository-name: gdarai/gdarai.github.io
          branch: main
          folder: dist
          clean: true